name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: cmd/validex/package-lock.json

      - name: Install desktop dependencies
        working-directory: cmd/validex
        run: npm ci

      - name: Check TypeScript
        working-directory: cmd/validex
        run: |
          npm run frontend:typecheck
          npm run electron:typecheck
          npm run frontend:test
          npm run electron:test

      - name: Test Go packages
        run: |
          go test ./...
          go vet ./...

      - name: Race-check Go packages
        run: go test -race ./...

  browser-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
          cache-dependency-path: |
            go.sum
            tests/e2e/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: cmd/validex/package-lock.json

      - name: Install desktop dependencies
        working-directory: cmd/validex
        run: npm ci

      - name: Verify browser runtime
        run: google-chrome --version

      - name: Run Cucumber browser acceptance tests
        run: make test-e2e

      - name: Upload Cucumber failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validex-cucumber-failures
          path: tests/e2e/artifacts/
          if-no-files-found: ignore

  package-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: cmd/validex/package-lock.json

      - name: Install desktop dependencies
        working-directory: cmd/validex
        run: npm ci

      - name: Build Electron application
        run: make build

      - name: Verify packaged application
        run: |
          resources="cmd/validex/build/bin/Validex.app/Contents/Resources"
          test -x "cmd/validex/build/bin/Validex.app/Contents/MacOS/Validex"
          test -x "cmd/validex/build/bin/validex-cli"
          test -s "$resources/frontend/index.html"
          test -s "$resources/frontend/appicon.png"
          test -s "$resources/frontend/appicon.svg"
          test -s "$resources/app/electron/dist/identity.js"
          test -s "$resources/app/electron/dist/security-identity.js"
          test -s "$resources/app/electron/dist/clipboard.js"
          test -s "$resources/app/electron/dist/graphics.js"
          test -s "$resources/application-identity.json"
          test -s "$resources/application-build.json"
          cmp internal/appidentity/manifest.json "$resources/application-identity.json"
          test -s "$resources/validex-backend"
          test -s "$resources/validex.icns"
          test ! -e "$resources/electron.icns"
          test -s "$resources/THIRD_PARTY_NOTICES.md"
          test -s "$resources/LICENSE.electron"
          test -s "$resources/LICENSES.chromium.html"
          test "$(
            plutil -extract CFBundleIconFile raw \
              "cmd/validex/build/bin/Validex.app/Contents/Info.plist"
          )" = "validex.icns"
          cmp "cmd/validex/build/Validex.icns" "$resources/validex.icns"
          for executable in "$resources/validex-backend" "cmd/validex/build/bin/validex-backend" "cmd/validex/build/bin/validex-cli"; do
            codesign --verify --strict "$executable"
            codesign --display --verbose=2 "$executable" 2>&1 | grep '^Identifier=com.validex.Validex$'
            "$executable" --identity
          done

  package-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: cmd/validex/package-lock.json

      - name: Install desktop dependencies
        working-directory: cmd/validex
        run: npm ci

      - name: Build Electron application
        run: make build

      - name: Verify packaged application
        run: |
          resources="cmd/validex/build/bin/Validex/resources"
          test -x "cmd/validex/build/bin/Validex/validex"
          test -x "cmd/validex/build/bin/validex-cli"
          test -s "$resources/frontend/index.html"
          test -s "$resources/frontend/appicon.png"
          test -s "$resources/frontend/appicon.svg"
          test -s "$resources/app/electron/dist/identity.js"
          test -s "$resources/app/electron/dist/security-identity.js"
          test -s "$resources/app/electron/dist/clipboard.js"
          test -s "$resources/app/electron/dist/graphics.js"
          test -s "$resources/application-identity.json"
          test -s "$resources/application-build.json"
          cmp internal/appidentity/manifest.json "$resources/application-identity.json"
          test -s "$resources/validex-backend"
          test -s "$resources/THIRD_PARTY_NOTICES.md"
          test -s "$resources/LICENSE.electron"
          test -s "$resources/LICENSES.chromium.html"
          "$resources/validex-backend" --identity
          cmd/validex/build/bin/validex-cli --identity
          ldd "cmd/validex/build/bin/Validex/validex" |
            tee "$RUNNER_TEMP/validex-ldd.txt"
          if grep -F "not found" "$RUNNER_TEMP/validex-ldd.txt"; then
            exit 1
          fi

  package-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: cmd/validex/package-lock.json

      - name: Install desktop dependencies
        working-directory: cmd/validex
        run: npm ci

      - name: Build Electron application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          node --test cmd/validex/scripts/windows-application-identity.test.mjs
          node cmd/validex/scripts/build-go.mjs backend cli
          try {
            Push-Location cmd/validex
            npm run build
          }
          finally {
            Pop-Location
          }
          node cmd/validex/scripts/package-electron.mjs

      - name: Verify packaged application
        shell: pwsh
        run: |
          $resources = "cmd/validex/build/bin/Validex/resources"
          $expected = @(
            "cmd/validex/build/bin/Validex/validex.exe",
            "cmd/validex/build/bin/validex-cli.exe",
            "$resources/frontend/index.html",
            "$resources/frontend/appicon.png",
            "$resources/frontend/appicon.svg",
            "$resources/app/electron/dist/identity.js",
            "$resources/app/electron/dist/security-identity.js",
            "$resources/app/electron/dist/clipboard.js",
            "$resources/app/electron/dist/graphics.js",
            "$resources/application-identity.json",
            "$resources/application-build.json",
            "$resources/validex-backend.exe",
            "$resources/THIRD_PARTY_NOTICES.md",
            "$resources/LICENSE.electron",
            "$resources/LICENSES.chromium.html"
          )
          foreach ($path in $expected) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing packaged file: $path"
            }
            if ((Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Empty packaged file: $path"
            }
          }
          foreach ($path in @("cmd/validex/build/bin/Validex/validex.exe", "$resources/validex-backend.exe", "cmd/validex/build/bin/validex-cli.exe")) {
            $version = (Get-Item -LiteralPath $path).VersionInfo
            if ($version.ProductName -ne "Validex" -or $version.InternalName -ne "com.validex.Validex" -or
                $version.OriginalFilename -ne (Split-Path -Leaf $path)) {
              throw "Incorrect Validex executable identity: $path"
            }
          }
          & "$resources/validex-backend.exe" --identity
          & "cmd/validex/build/bin/validex-cli.exe" --identity
